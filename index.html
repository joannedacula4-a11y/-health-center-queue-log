<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Center Queue Log - Brgy. Caparan</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
body { font-family: Arial, sans-serif; background: #f2f7f2; margin: 0; padding: 20px; }
.container { max-width: 800px; margin: auto; background: white; padding: 28px 22px 22px 22px; border-radius: 10px; }
h1 { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-weight: 800; text-align: center; color: #1a5c2a; margin-bottom: 8px; margin-top: 10px; line-height: 1.45; text-transform: uppercase; letter-spacing: 0.5px; font-size: 28px; }
.subtitle { font-family: 'Merriweather', Georgia, 'Times New Roman', serif; font-weight: 400; text-align: center; color: #444; margin-top: 0; margin-bottom: 8px; line-height: 1.9; font-size: 16px; letter-spacing: 0.4px; }
.auto-time { text-align: center; background: #f2f7f2; border: 1px solid #d0e8d0; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; color: #1a5c2a; font-weight: bold; line-height: 1.6; }
.auto-time span { color: #333; font-weight: normal; }
label { display: block; margin-top: 14px; font-weight: bold; line-height: 1.5; }
input, select { width: 100%; padding: 14px 12px; margin-top: 6px; margin-bottom: 6px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; line-height: 1.5; background: white; display: block; }
input::placeholder { color: #888; }
select:invalid { color: #888; }
button { width: 100%; padding: 14px; margin-top: 16px; background: #1a5c2a; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; line-height: 1.5; display: block; }
#error { color: red; margin-top: 10px; display: none; font-weight: bold; background: #ffe6e6; padding: 10px; border-radius: 5px; }
.table-wrap { overflow-x: auto; margin-top: 22px; }
table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 700px; }
th, td { border: 1px solid #ddd; padding: 16px 14px; text-align: left; font-size: 15px; line-height: 1.6; letter-spacing: 0.3px; vertical-align: middle; }
th { background: #1a5c2a; color: white; white-space: nowrap; }
td { word-break: normal; overflow-wrap: break-word; }
td:nth-child(4), td:nth-child(5) { white-space: nowrap; }
.deleteBtn { background: #c0392b; color: white; border: none; padding: 8px 14px; border-radius: 5px; cursor: pointer; width: auto; min-width: 40px; margin: 0; font-size: 18px; font-weight: bold; line-height: 1; white-space: nowrap; }
.search-box { background: #f2f7f2; padding: 14px; border-radius: 8px; margin-top: 20px; border: 1px solid #d0e8d0; }
.search-row { display: flex; gap: 8px; }
.search-row input { flex: 1; }
.search-row button { width: 95px; margin-top: 6px; padding: 14px 6px; font-size: 14px; }
#searchMsg { font-size: 13px; color: #1a5c2a; margin: 8px 0 0 0; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
<h1>HEALTH CENTER QUEUE LOG</h1>
<p class="subtitle">Brgy. Caparan Ipil, Zamboanga Sibugay</p>
<div class="auto-time"> Date & Time is Automatic<br> <span id="currentDateTime">Loading...</span> </div>
<label for="name">Patient Name</label>
<input type="text" id="name" placeholder="e.g. JoAnne Dacula" autocomplete="off">
<small style="color:#666;">Required: First Name + Last Name. First letter of each name must be Uppercase. Example: JoAnne Dacula</small>
<label for="purpose">Purpose of Visit</label>
<select id="purpose" required>
<option value="" disabled selected>Select Purpose of Visit</option>
<option value="Check-up">Check-up</option>
<option value="Vaccination">Vaccination</option>
<option value="Prenatal">Prenatal</option>
<option value="Medicine Request">Medicine Request</option>
<option value="Dental">Dental</option>
<option value="Family Planning">Family Planning</option>
<option value="Immunization">Immunization</option>
<option value="Wound Dressing">Wound Dressing</option>
<option value="Follow-up Check-up">Follow-up Check-up</option>
<option value="Consultation">Consultation</option>
<option value="Others">Others</option>
</select>
<div id="error">Please enter a patient name.</div>
<button id="addBtn" type="button">ADD TO QUEUE</button>
<button id="clearBtn" type="button" style="background:#c0392b;">CLEAR ALL</button>
<div class="search-box">
<label for="search">Search Patient</label>
<div class="search-row">
<input type="text" id="search" placeholder="Type complete name...">
<button id="searchBtn" type="button">SEARCH</button>
<button id="clearSearchBtn" type="button" style="background:#666;">CLEAR</button>
</div>
<p id="searchMsg"></p>
</div>
<div class="table-wrap">
<table>
<thead><tr><th>Queue No.</th><th>Patient Name</th><th>Purpose</th><th>Date</th><th>Time</th><th>Delete</th></tr></thead>
<tbody id="queueList"></tbody>
</table>
</div>
</div>
<script>
var queue = [];
try { queue = JSON.parse(localStorage.getItem('caparanQueue') || '[]'); } catch(e){ queue = []; }
var currentSearch = '';
function saveQueue(){ try{ localStorage.setItem('caparanQueue', JSON.stringify(queue)); }catch(e){} }
function getAutoDateTime(){ var now = new Date(); var yyyy = now.getFullYear(); var mm = String(now.getMonth()+1).padStart(2,'0'); var dd = String(now.getDate()).padStart(2,'0'); var date = yyyy + '-' + mm + '-' + dd; var hh = String(now.getHours()).padStart(2,'0'); var min = String(now.getMinutes()).padStart(2,'0'); var time = hh + ':' + min; return { date: date, time: time, now: now }; }
function updateCurrentDateTimeDisplay(){ var auto = getAutoDateTime(); var display = auto.now.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric' }) + ' | ' + auto.now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }); document.getElementById('currentDateTime').textContent = display; }
updateCurrentDateTimeDisplay(); setInterval(updateCurrentDateTimeDisplay, 1000);
function formatTimeToAMPM(time24) { if (!time24) return ''; var parts = time24.split(':'); var hour = parseInt(parts[0], 10); var minute = parts[1] || '00'; var ampm = hour >= 12 ? 'PM' : 'AM'; var hour12 = hour % 12; if (hour12 === 0) hour12 = 12; return hour12 + ':' + minute + ' ' + ampm; }
function formatDateToMDY(dateStr) { if (!dateStr) return ''; var parts = dateStr.split('-'); if (parts.length !== 3) return dateStr; return parts[1] + '-' + parts[2] + '-' + parts[0]; }
function normalizeName(str){ return str.trim().toLowerCase().replace(/\s+/g, ' '); }
function validateName(rawName){
  var clean = rawName.trim().replace(/\s+/g, ' ');
  if (clean === '') { return { valid: false, message: 'Please enter a patient name.' }; }
  if (/[0-9@#$%^&*()_+=\[\]{};:\\|\"<>\/?.!,~`]/.test(clean)) { return { valid: false, message: 'Invalid name. Letters only. No numbers or symbols.' }; }
  if (!/^[A-Za-zÑñ' \-]+$/.test(clean)) { return { valid: false, message: 'Invalid name. Letters only. No numbers or symbols.' }; }
  if (clean.indexOf(' ') === -1) { return { valid: false, message: 'Please enter First Name and Last Name. One name is not allowed.' }; }
  var parts = clean.split(' ').filter(function(w){ return w.length > 0; });
  if (parts.length < 2) { return { valid: false, message: 'Please enter First Name and Last Name. One name is not allowed.' }; }
  for (var i = 0; i < parts.length; i++) { var wordOnlyLetters = parts[i].replace(/['-]/g, ''); if (wordOnlyLetters.length < 2) { return { valid: false, message: 'First Name and Last Name must be at least 2 letters each.' }; } }
  for (var j = 0; j < parts.length; j++) { var word = parts[j]; var subWords = word.split(/[-']/); for (var k = 0; k < subWords.length; k++) { var sub = subWords[k]; if (sub.length === 0) continue; if (!/^[A-ZÑ][A-Za-zÑñ]+$/.test(sub)) { return { valid: false, message: 'Invalid name format. First letter of First Name and Last Name must be Uppercase. Example: JoAnne Dacula' }; } } }
  return { valid: true, message: '', clean: clean };
}
function displayQueue() {
  var list = document.getElementById('queueList'); var msg = document.getElementById('searchMsg'); list.innerHTML = ''; var count = 0;
  for (var i = 0; i < queue.length; i++) {
    var p = queue[i];
    if (currentSearch !== '' && normalizeName(p.name) !== currentSearch) continue;
    count++;
    var tr = document.createElement('tr');
    // FIXED: inline onclick para sigurado tatawagin si deleteOne
    tr.innerHTML = '<td>' + count + '</td><td>' + p.name + '</td><td>' + p.purpose + '</td><td>' + formatDateToMDY(p.date) + '</td><td>' + formatTimeToAMPM(p.time) + '</td><td><button class="deleteBtn" onclick="deleteOne(' + i + ')">X</button></td>';
    list.appendChild(tr);
  }
  if (currentSearch !== '') { if (count === 0) msg.textContent = "No patient found for '" + document.getElementById('search').value.trim() + "'. Please type complete name."; else msg.textContent = "Found " + count + " patient(s) for '" + document.getElementById('search').value.trim() + "'"; }
  else { if (queue.length === 0) { list.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888;">No patients in queue yet. Add one above.</td></tr>'; msg.textContent = ''; } else { msg.textContent = 'Showing all ' + queue.length + ' patient(s)'; } }
}
function doSearch(){ currentSearch = normalizeName(document.getElementById('search').value); displayQueue(); }
function clearSearch(){ document.getElementById('search').value = ''; currentSearch = ''; displayQueue(); }
function addPatient() {
  var nameInput = document.getElementById('name'); var error = document.getElementById('error');
  var check = validateName(nameInput.value);
  if (!check.valid) { error.textContent = check.message; error.style.display = 'block'; alert(check.message); nameInput.focus(); return; }
  error.style.display = 'none';
  var name = check.clean;
  var purpose = document.getElementById('purpose').value;
  if (purpose === '') { error.textContent = 'Please select Purpose of Visit.'; error.style.display = 'block'; alert('Please select Purpose of Visit.'); return; }
  // FIXED: REJECT DUPLICATE NAME - kahit iba Purpose, bawal ulitin Name
  for (var d = 0; d < queue.length; d++) {
    if (normalizeName(queue[d].name) === normalizeName(name)) {
      var dupMsg = 'Patient already in queue: ' + name + '. Duplicate name is not allowed.';
      error.textContent = dupMsg; error.style.display = 'block'; alert(dupMsg); nameInput.focus(); return;
    }
  }
  var auto = getAutoDateTime();
  queue.push({ date: auto.date, name: name, purpose: purpose, time: auto.time });
  saveQueue(); clearSearch(); displayQueue(); nameInput.value = ''; document.getElementById('purpose').value = '';
  alert('Added: ' + name + ' | ' + formatDateToMDY(auto.date) + ' ' + formatTimeToAMPM(auto.time));
}
function deleteOne(index) {
  var p = queue[index]; if (!p) return;
  if (confirm('Are you sure you want to delete ' + p.name + '?')) { queue.splice(index, 1); saveQueue(); displayQueue(); }
}
function clearQueue() { if (confirm("Are you sure you want to clear all patients from the queue?")) { queue = []; saveQueue(); clearSearch(); displayQueue(); alert('Queue cleared'); } }
document.getElementById('addBtn').onclick = addPatient;
document.getElementById('clearBtn').onclick = clearQueue;
document.getElementById('searchBtn').onclick = doSearch;
document.getElementById('clearSearchBtn').onclick = clearSearch;
document.getElementById('search').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ doSearch(); } });
document.getElementById('name').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); addPatient(); } });
displayQueue();
</script>
</body>
  </html>
