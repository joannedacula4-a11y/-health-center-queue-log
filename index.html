<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Center Queue Log - Brgy. Caparan</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
body { font-family: Arial, sans-serif; background: #f2f7f2; margin: 0; padding: 20px; }
.container { max-width: 800px; margin: auto; background: white; padding: 28px 22px 22px 22px; border-radius: 10px; }
h1 { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-weight: 800; text-align: center; color: #1a5c2a; margin-bottom: 18px; margin-top: 10px; line-height: 1.45; text-transform: uppercase; letter-spacing: 0.5px; font-size: 28px; }
.subtitle { font-family: 'Merriweather', Georgia, 'Times New Roman', serif; font-weight: 400; text-align: center; color: #444; margin-top: 0; margin-bottom: 30px; line-height: 1.9; font-size: 16px; letter-spacing: 0.4px; }
label { display: block; margin-top: 14px; font-weight: bold; line-height: 1.5; }
input, select { width: 100%; padding: 14px 12px; margin-top: 6px; margin-bottom: 6px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; line-height: 1.5; background: white; display: block; }
input::placeholder { color: #888; }
select:invalid { color: #888; }
button { width: 100%; padding: 14px; margin-top: 16px; background: #1a5c2a; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; line-height: 1.5; display: block; }
#error { color: red; margin-top: 10px; display: none; font-weight: bold; }
.table-wrap { overflow-x: auto; margin-top: 22px; }
table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 700px; }
th, td { border: 1px solid #ddd; padding: 16px 14px; text-align: left; font-size: 15px; line-height: 1.6; letter-spacing: 0.3px; vertical-align: middle; }
th { background: #1a5c2a; color: white; white-space: nowrap; }
td { word-break: normal; overflow-wrap: break-word; }
td:nth-child(4), td:nth-child(5) { white-space: nowrap; }
.deleteBtn { background: #c0392b; color: white; border: none; padding: 8px 14px; border-radius: 5px; cursor: pointer; width: auto; min-width: 40px; margin: 0; font-size: 18px; font-weight: bold; line-height: 1; white-space: nowrap; }
.search-box { background: #f2f7f2; padding: 14px; border-radius: 8px; margin-top: 20px; }
.search-row { display: flex; gap: 8px; }
.search-row input { flex: 1; }
.search-row button { width: 90px; margin-top: 6px; padding: 14px 8px; }
#searchMsg { font-size: 13px; color: #666; margin: 6px 0 0 0; display: none; }
#noResult { text-align: center; color: #c0392b; font-weight: bold; padding: 20px; }
</style>
</head>
<body>
<div class="container">
<h1>HEALTH CENTER QUEUE LOG</h1>
<p class="subtitle">Brgy. Caparan Ipil, Zamboanga Sibugay</p>

<label for="name">Patient Name</label>
<input type="text" id="name" placeholder="e.g. JoAnne Dacula">

<label for="purpose">Purpose of Visit</label>
<select id="purpose" required>
<option value="" disabled selected>Select Purpose of Visit</option>
<option value="Check-up">Check-up</option>
<option value="Vaccination">Vaccination</option>
<option value="Prenatal">Prenatal</option>
<option value="Medicine Request">Medicine Request</option>
<option value="Dental">Dental</option>
<option value="Family Planning">Family Planning</option>
<option value="Immunization">Immunization</option>
<option value="Wound Dressing">Wound Dressing</option>
<option value="Follow-up Check-up">Follow-up Check-up</option>
<option value="Consultation">Consultation</option>
<option value="Others">Others</option>
</select>

<label for="visitDate">Date</label>
<input type="text" id="visitDate" placeholder="Select Date" onfocus="this.type='date'" onblur="if(!this.value) this.type='text'">

<label for="time">Time of Arrival</label>
<input type="text" id="time" placeholder="Select Time of Arrival" onfocus="this.type='time'" onblur="if(!this.value) this.type='text'">
<div id="error">Please enter a patient name.</div>

<button id="addBtn">ADD TO QUEUE</button>
<button id="clearBtn" style="background:#c0392b;">CLEAR ALL</button>

<div class="search-box">
<label for="search">Search Patient</label>
<div class="search-row">
<input type="text" id="search" placeholder="Search name... e.g. JoAnne">
<button id="clearSearchBtn" style="background:#666;">CLEAR</button>
</div>
<p id="searchMsg"></p>
</div>

<div class="table-wrap">
<table>
<thead>
<tr><th>Queue No.</th><th>Patient Name</th><th>Purpose</th><th>Date</th><th>Time</th><th>Delete</th></tr>
</thead>
<tbody id="queueList"></tbody>
</table>
</div>
</div>

<script>
var queue = JSON.parse(localStorage.getItem('caparanQueue') || '[]');
function saveQueue(){ localStorage.setItem('caparanQueue', JSON.stringify(queue)); }
function formatTimeToAMPM(time24) {
  if (!time24) return '';
  var parts = time24.split(':');
  var hour = parseInt(parts[0], 10);
  var minute = parts[1];
  var ampm = hour >= 12 ? 'PM' : 'AM';
  var hour12 = hour % 12;
  if (hour12 === 0) hour12 = 12;
  return hour12 + ':' + minute + ' ' + ampm;
}
function formatDateToMDY(dateStr) {
  if (!dateStr) return '';
  var parts = dateStr.split('-');
  if (parts.length !== 3) return dateStr;
  return parts[1] + '-' + parts[2] + '-' + parts[0];
}
function displayQueue() {
  var list = document.getElementById('queueList');
  var searchInput = document.getElementById('search');
  var searchText = searchInput.value.trim().toLowerCase();
  var msg = document.getElementById('searchMsg');
  list.innerHTML = '';
  var shown = 0;
  for (var i = 0; i < queue.length; i++) {
    var p = queue[i];
    if (searchText !== '' && p.name.toLowerCase().indexOf(searchText) === -1) { continue; }
    shown++;
    list.innerHTML += '<tr><td>' + shown + '</td><td>' + p.name + '</td><td>' + p.purpose + '</td><td>' + formatDateToMDY(p.date) + '</td><td>' + formatTimeToAMPM(p.time) + '</td><td><button class="deleteBtn" onclick="deleteOne(' + i + ')">X</button></td></tr>';
  }
  if (searchText !== '') {
    msg.style.display = 'block';
    if (shown === 0) {
      msg.textContent = "No patient found for '" + searchInput.value + "'. Pindutin ang CLEAR para bumalik lahat.";
      list.innerHTML = '<tr><td colspan="6" id="noResult">No patient found</td></tr>';
    } else {
      msg.textContent = "Showing " + shown + " result(s) for '" + searchInput.value + "'";
    }
  } else {
    msg.style.display = 'none';
    if (queue.length === 0) {
      list.innerHTML = '<tr
