<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Center Queue Log - Brgy. Caparan</title>
<style>
body { font-family: Arial, sans-serif; background: #f2f7f2; margin: 0; padding: 20px; }
.container { max-width: 800px; margin: auto; background: white; padding: 18px; border-radius: 10px; }
h1 { text-align: center; color: #1a5c2a; margin-bottom: 5px; line-height: 1.2; text-transform: uppercase; }
p { text-align: center; color: #555; margin-top: 0; margin-bottom: 25px; }
label { display: block; margin-top: 12px; font-weight: bold; }
input, select { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
button { width: 100%; padding: 12px; margin-top: 15px; background: #1a5c2a; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
button:hover { background: #144a21; }
#error { color: red; margin-top: 10px; display: none; font-weight: bold; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; table-layout: fixed; word-wrap: break-word; }
th, td { border: 1px solid #ddd; padding: 12px 8px; text-align: left; font-size: 14px; vertical-align: top; }
th { background: #1a5c2a; color: white; }
</style>
</head>
<body>
<div class="container">
<h1>HEALTH CENTER QUEUE LOG</h1>
<p>Brgy. Caparan Ipil, Zamboanga Sibugay</p>
<p id="currentDate" style="text-align:center; font-size:16px; font-weight:bold; color:#1a5c2a; margin-top:5px;"></p>

<label for="name">Patient Name</label>
<input type="text" id="name" placeholder="e.g. Juan Dela Cruz">

<label for="purpose">Purpose of Visit</label>
<select id="purpose">
<option value="Check-up">Check-up</option>
<option value="Vaccination">Vaccination</option>
<option value="Prenatal">Prenatal</option>
<option value="Medicine Request">Medicine Request</option>
<option value="Dental">Dental</option>
<option value="Family Planning">Family Planning</option>
<option value="Immunization">Immunization</option>
<option value="Wound Dressing">Wound Dressing</option>
<option value="Follow-up Check-up">Follow-up Check-up</option>
<option value="Consultation">Consultation</option>
<option value="Others">Others</option>
</select>

<label for="time">Time of Arrival</label>
<input type="time" id="time">

<div id="error">Please enter a patient name.</div>
<button onclick="addPatient()">ADD TO QUEUE</button>
<button onclick="clearQueue()" style="background:#c0392b; width:100%; padding:12px; color:white; border:none; border-radius:5px; font-size:16px; margin-top:10px;">CLEAR ALL</button>

<table>
<thead>
<tr>
<th>Queue No.</th> 
<label style="font-weight:bold;">Date</label>
<input type="date" id="visitDate" style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:5px;">
Patient Name
<th>Patient Name</th>
<th>Purpose</th>
<th>Time of Arrival</th>
</tr>
</thead>
<tbody id="queueList"></tbody>
</table>
</div>

<script>
let queue = JSON.parse(localStorage.getItem('queue')) || [];

function displayQueue() {
  let list = document.getElementById('queueList');
  list.innerHTML = '';
  queue.forEach(function(p) {
    let row = '<tr><td>' + p.number + '</td><td>' + p.name + '</td><td>' + p.purpose + '</td><td>' + p.time + '</td></tr>';
    list.innerHTML += row;
  });
}

function addPatient() {
  let nameInput = document.getElementById('name');
  let name = nameInput.value.trim();
  let error = document.getElementById('error');

  if (name === '') {
    error.style.display = 'block';
    return;
  }
  error.style.display = 'none';

  let purpose = document.getElementById('purpose').value;
  let time = document.getElementById('time').value;
  if (time === '') {
    let now = new Date();
    time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
  }

  let nextNumber = queue.length + 1;
  let patient = { number: nextNumber, name: name, purpose: purpose, time: time };
  queue.push(patient);
  localStorage.setItem('queue', JSON.stringify(queue));
  displayQueue();
  nameInput.value = '';
}

displayQueue();
  function clearQueue() {
  if (confirm("Are you sure you want to clear all patients from the queue?")) {
    localStorage.clear();
    location.reload();
  }
    }
  
Show today's date automatically
const today = new Date();
const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
document.getElementById('currentDate').textContent = today.toLocaleDateString('en-US', options);
document.getElementById('visitDate').valueAsDate = today;
  
</script>
</body>
  </html>
